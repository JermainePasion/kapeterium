    <!-- Navigation Bar -->

            <li><a href="#home">Home</a></li>

    <!-- HOMEPAGE -->

            </div>
        </div>

<div id="carouselExampleIndicators" class="carousel slide" data-ride="carousel">

        <div class="item">

                       (Front Lourdes Chapel), Angeles City,<br>Pampanga</p>
            
                    <a href="https://www.instagram.com/kapeterium/" id="instagram-link" class="social-link">
                        <img id="instagram-icon" class="social-icon" src="photos/IG.png" alt="Instagram"> ‎KAPETERIUM

                    <br>
                    <a href="https://www.facebook.com/p/Kapeterium-100090098651446/" id="facebook-link" class="social-link">
